
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundstation - Seguimiento de Fondos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fa !important;
        }

        .container {
            max-width: 1500px;
        }

        .card {
            border-radius: 12px;
            overflow: hidden;
        }

        .table {
            font-size: .88rem;
        }

        .table td, .table th {
            white-space: nowrap;
            padding: 13px 12px;
        }

        /* Fondos predeterminados en azul */
        .default-fund {
            background-color: #e8f2ff !important;
        }

        .default-fund:hover {
            background-color: #d8eaff !important;
        }

        .fund-name {
            min-width: 220px;
            white-space: normal !important;
        }

        .positive {
            color: #198754;
            font-weight: 600;
        }

        .negative {
            color: #dc3545;
            font-weight: 600;
        }

        .header-subtitle {
            color: #748094;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <header class="mb-4">
        <h1 class="h3 fw-bold text-dark">Fundstation</h1>
        <p class="header-subtitle">
            Seguimiento de fondos de inversión y ETFs
        </p>
    </header>

    <div id="loading" class="alert alert-primary shadow-sm">
        <span class="spinner-border spinner-border-sm me-2"></span>
        Consultando datos de Morningstar...
    </div>

    <div id="error-container"></div>

    <div id="table-card" class="card shadow-sm border-0" style="display:none">

        <div class="card-header bg-white py-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <strong>Mis fondos</strong>
                <small class="text-muted" id="fund-count"></small>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">

                <table class="table table-hover mb-0 align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>ISIN</th>
                            <th>Categoría</th>
                            <th class="text-end">Precio</th>
                            <th class="text-center">Fecha</th>
                            <th class="text-end">1D (%)</th>
                            <th class="text-end">1W (%)</th>
                            <th class="text-end">3M (%)</th>
                            <th class="text-end">6M (%)</th>
                            <th class="text-end">1Y (%)</th>
                        </tr>
                    </thead>

                    <tbody id="funds-body"></tbody>

                </table>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {

    // Fondos predeterminados
    const defaultFunds = [
        "ES0173311103",
        "LU0281484880",
        "LU1213836080",
        "LU0300834669",
        "ES0110407162",
        "LU3038481936",
        "ES0174115065",
        "LU1598719752"
    ];

    // Leer fondos adicionales desde la URL
    const urlParams = new URLSearchParams(window.location.search);

    const customFunds = (urlParams.get('myfunds') || '')
        .split(',')
        .map(f => f.trim().toUpperCase())
        .filter(f => /^[A-Z]{2}[A-Z0-9]{10}$/.test(f));

    // Combinar fondos sin duplicados
    const fundsList = [
        ...new Set([...defaultFunds, ...customFunds])
    ];

    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-container');
    const tableCard = document.getElementById('table-card');
    const tbody = document.getElementById('funds-body');

    // Mostrar errores
    function showError(message) {
        loadingEl.style.display = 'none';
        errorEl.innerHTML = '';

        const alert = document.createElement('div');
        alert.className = 'alert alert-danger shadow-sm';

        const title = document.createElement('strong');
        title.textContent = 'Error al cargar los fondos';

        const description = document.createElement('p');
        description.className = 'mb-0 mt-2';
        description.textContent = message;

        alert.appendChild(title);
        alert.appendChild(description);
        errorEl.appendChild(alert);
    }

    // Consulta JSONP a Morningstar
    function fetchJSONP(url) {
        return new Promise((resolve, reject) => {

            const callbackName = 'fundstation_' +
                Date.now() + '_' +
                Math.random().toString(36).substring(2);

            const script = document.createElement('script');
            let finished = false;

            const timer = setTimeout(() => {
                finish(new Error(
                    'Tiempo de espera agotado al conectar con Morningstar.'
                ));
            }, 12000);

            function finish(error, data) {
                if (finished) return;

                finished = true;
                clearTimeout(timer);

                delete window[callbackName];
                script.remove();

                if (error) {
                    reject(error);
                } else {
                    resolve(data);
                }
            }

            window[callbackName] = data => {
                finish(null, data);
            };

            script.onerror = () => {
                finish(new Error(
                    'No se ha podido conectar con Morningstar.'
                ));
            };

            script.src = url + '&callback=' + callbackName;

            document.body.appendChild(script);
        });
    }

    // Formatear rentabilidades
    function formatPercent(value) {

        if (value === null || value === undefined || value === '') {
            return '-';
        }

        const number = Number(value);

        if (!Number.isFinite(number)) {
            return '-';
        }

        const cls = number > 0
            ? 'positive'
            : number < 0
                ? 'negative'
                : '';

        return `<span class="${cls}">${number.toFixed(2)}%</span>`;
    }

    // Añadir celda
    function addCell(row, content, className = '') {
        const td = document.createElement('td');
        td.className = className;
        td.innerHTML = content;
        row.appendChild(td);
    }

    // Pintar fondo
    function renderFund(fund) {

        const isin = (fund.Isin || '').toUpperCase();

        // Identificar fondos predeterminados
        const isDefault = defaultFunds.includes(isin);

        const row = document.createElement('tr');

        // Los fondos predeterminados aparecen en azul
        if (isDefault) {
            row.classList.add('default-fund');
        }

        // Nombre y enlace Morningstar
        const nameCell = document.createElement('td');
        nameCell.className = 'fund-name';

        const link = document.createElement('a');

        link.href =
            'https://www.morningstar.es/es/funds/snapshot/snapshot.aspx?id=' +
            encodeURIComponent(fund.SecId || '');

        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'text-decoration-none fw-bold text-dark';
        link.textContent = fund.LegalName || fund.Name || 'N/D';

        nameCell.appendChild(link);
        row.appendChild(nameCell);

        addCell(row, `<code>${isin || 'N/D'}</code>`);

        addCell(
            row,
            `<span class="badge bg-secondary">${fund.CategoryName || 'N/D'}</span>`
        );

        addCell(
            row,
            fund.ClosePrice !== undefined && fund.ClosePrice !== null
                ? `${fund.ClosePrice} ${fund.PriceCurrency || ''}`
                : 'N/D',
            'text-end fw-bold'
        );

        addCell(
            row,
            fund.ClosePriceDate
                ? fund.ClosePriceDate.substring(0, 10)
                : 'N/D',
            'text-center text-muted small'
        );

        addCell(row, formatPercent(fund.GBRReturnD1), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnW1), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnM3), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnM6), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnM12), 'text-end');

        tbody.appendChild(row);
    }

    try {

        const baseUrl =
            'https://lt.morningstar.com/api/rest.svc/9vehuxllxs/security/screener';

        const securityDataPoints = [
            'Isin',
            'SecId',
            'Name',
            'LegalName',
            'CategoryName',
            'ClosePriceDate',
            'ClosePrice',
            'PriceCurrency',
            'GBRReturnD1',
            'GBRReturnW1',
            'GBRReturnM3',
            'GBRReturnM6',
            'GBRReturnM12'
        ].join('|');

        const baseParams = {
            page: '1',
            pageSize: '100',
            sortOrder: 'LegalName asc',
            outputType: 'json',
            version: '1',
            languageId: 'es-ES',
            currencyId: 'EUR',
            filters: 'Isin:IN:' + fundsList.join(':'),
            securityDataPoints: securityDataPoints
        };

        let result = null;

        // Primera consulta: universo español
        const params1 = new URLSearchParams({
            ...baseParams,
            universeIds: 'FOESP$$ALL'
        });

        result = await fetchJSONP(
            `${baseUrl}?${params1.toString()}`
        );

        // Comprobar qué ISIN ha devuelto Morningstar
        const foundIsins = new Set(
            (result?.rows || []).map(f =>
                (f.Isin || '').toUpperCase()
            )
        );

        const missingIsins = fundsList.filter(
            isin => !foundIsins.has(isin)
        );

        // Si falta algún fondo, intentar sin limitar el universo
        if (missingIsins.length > 0) {

            const params2 = new URLSearchParams(baseParams);

            result = await fetchJSONP(
                `${baseUrl}?${params2.toString()}`
            );
        }

        if (!result || !Array.isArray(result.rows)) {
            throw new Error(
                'Morningstar no ha devuelto una respuesta válida.'
            );
        }

        // Crear índice por ISIN
        const fundsByIsin = new Map();

        result.rows.forEach(fund => {

            if (fund.Isin) {
                fundsByIsin.set(
                    fund.Isin.toUpperCase(),
                    fund
                );
            }

        });

        // Respetar el orden solicitado
        const validFunds = fundsList
            .map(isin => fundsByIsin.get(isin))
            .filter(Boolean);

        loadingEl.style.display = 'none';

        if (validFunds.length === 0) {
            showError(
                'Morningstar no ha devuelto registros para los ISIN indicados. ' +
                'Comprueba los identificadores o la disponibilidad del servicio.'
            );
            return;
        }

        // Pintar tabla
        validFunds.forEach(renderFund);

        document.getElementById('fund-count').textContent =
            `${validFunds.length} fondos encontrados`;

        tableCard.style.display = 'block';

        // Avisar de fondos no encontrados
        const finalMissing = fundsList.filter(
            isin => !fundsByIsin.has(isin)
        );

        if (finalMissing.length > 0) {

            const warning = document.createElement('div');
            warning.className = 'alert alert-warning mt-3';

            warning.textContent =
                'No se han encontrado estos ISIN: ' +
                finalMissing.join(', ');

            errorEl.appendChild(warning);
        }

    } catch (error) {

        showError(
            error.message || 'Error desconocido al consultar Morningstar.'
        );

        console.error('Fundstation:', error);
    }

});
</script>

</body>
</html>
