
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundstation - Seguimiento de Fondos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fa !important;
        }

        .container {
            max-width: 1500px;
        }

        .card {
            border-radius: 12px;
            overflow: hidden;
        }

        .table {
            font-size: .88rem;
        }

        .table td, .table th {
            white-space: nowrap;
            padding: 13px 12px;
        }

        .default-fund > td {
            background-color: #e8f2ff !important;
        }

        .default-fund:hover > td {
            background-color: #d8eaff !important;
        }

        .fund-name {
            min-width: 220px;
            white-space: normal !important;
        }

        .positive {
            color: #198754;
            font-weight: 600;
        }

        .negative {
            color: #dc3545;
            font-weight: 600;
        }

        .header-subtitle {
            color: #748094;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <header class="mb-4">
        <h1 class="h3 fw-bold text-dark">Fundstation</h1>
        <p class="header-subtitle">
            Seguimiento de fondos de inversión y ETFs
        </p>
    </header>

    <div id="loading" class="alert alert-primary shadow-sm">
        <span class="spinner-border spinner-border-sm me-2"></span>
        Consultando datos de Morningstar...
    </div>

    <div id="error-container"></div>

    <div id="table-card" class="card shadow-sm border-0" style="display:none">

        <div class="card-header bg-white py-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <strong>Mis fondos</strong>
                <small class="text-muted" id="fund-count"></small>
            </div>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>ISIN</th>
                            <th>Categoría</th>
                            <th class="text-end">Precio</th>
                            <th class="text-center">Fecha</th>
                            <th class="text-end">1D (%)</th>
                            <th class="text-end">1W (%)</th>
                            <th class="text-end">3M (%)</th>
                            <th class="text-end">6M (%)</th>
                            <th class="text-end">1Y (%)</th>
                        </tr>
                    </thead>
                    <tbody id="funds-body"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {

    // ==========================================
    // CONFIGURACIÓN DE FONDOS
    // ==========================================

    const defaultFunds = [
        "ES0173311103",
        "LU0281484880",
        "LU1213836080",
        "LU0300834669",
        "ES0110407162",
        "LU3038481936",
        "ES0174115065",
        "LU1598719752"
    ];

    // Leer fondos adicionales desde la URL
    const urlParams = new URLSearchParams(window.location.search);

    const customFunds = (urlParams.get('myfunds') || '')
        .split(',')
        .map(f => f.trim().toUpperCase())
        .filter(f => /^[A-Z]{2}[A-Z0-9]{10}$/.test(f));

    // Combinar sin duplicados
    const fundsList = [
        ...new Set([...defaultFunds, ...customFunds])
    ];

    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error-container');
    const tableCard = document.getElementById('table-card');
    const tbody = document.getElementById('funds-body');

    // ==========================================
    // API MORNINGSTAR
    // ==========================================

    const baseUrl =
        'https://lt.morningstar.com/api/rest.svc/9vehuxllxs/security/screener';

    const securityDataPoints = [
        'Isin',
        'SecId',
        'Name',
        'LegalName',
        'CategoryName',
        'ClosePriceDate',
        'ClosePrice',
        'PriceCurrency',
        'GBRReturnD1',
        'GBRReturnW1',
        'GBRReturnM3',
        'GBRReturnM6',
        'GBRReturnM12'
    ].join('|');

    // ==========================================
    // JSONP
    // ==========================================

    function fetchJSONP(url) {

        return new Promise((resolve, reject) => {

            const callbackName = 'fundstation_' +
                Date.now() + '_' +
                Math.random().toString(36).substring(2);

            const script = document.createElement('script');

            let finished = false;

            const timer = setTimeout(() => {
                finish(new Error('Tiempo de espera agotado.'));
            }, 12000);

            function finish(error, data) {

                if (finished) return;

                finished = true;

                clearTimeout(timer);

                delete window[callbackName];

                script.remove();

                if (error) {
                    reject(error);
                } else {
                    resolve(data);
                }
            }

            window[callbackName] = data => {
                finish(null, data);
            };

            script.onerror = () => {
                finish(new Error('Error de conexión con Morningstar.'));
            };

            script.src = url + '&callback=' + callbackName;

            document.body.appendChild(script);
        });
    }

    // ==========================================
    // CONSULTA INDIVIDUAL DE CADA FONDO
    // ==========================================

    async function fetchFund(isin) {

        const baseParams = {
            page: '1',
            pageSize: '1',
            sortOrder: 'LegalName asc',
            outputType: 'json',
            version: '1',
            languageId: 'es-ES',
            currencyId: 'EUR',
            filters: 'Isin:IN:' + isin,
            securityDataPoints: securityDataPoints
        };

        // Primera búsqueda: universo español
        try {

            const params1 = new URLSearchParams({
                ...baseParams,
                universeIds: 'FOESP$$ALL'
            });

            const result1 = await fetchJSONP(
                `${baseUrl}?${params1.toString()}`
            );

            if (result1 && Array.isArray(result1.rows)) {

                const matched = result1.rows.find(
                    f => (f.Isin || '').toUpperCase() === isin
                );

                if (matched) return matched;
            }

        } catch (error) {
            console.warn(
                'Primera búsqueda fallida para ' + isin,
                error
            );
        }

        // Segunda búsqueda: sin restringir el universo
        try {

            const params2 = new URLSearchParams(baseParams);

            const result2 = await fetchJSONP(
                `${baseUrl}?${params2.toString()}`
            );

            if (result2 && Array.isArray(result2.rows)) {

                const matched = result2.rows.find(
                    f => (f.Isin || '').toUpperCase() === isin
                );

                if (matched) return matched;
            }

        } catch (error) {
            console.warn(
                'Segunda búsqueda fallida para ' + isin,
                error
            );
        }

        console.warn('Fondo no encontrado:', isin);

        return null;
    }

    // ==========================================
    // FORMATO DE DATOS
    // ==========================================

    function formatPercent(value) {

        if (value === null || value === undefined || value === '') {
            return '-';
        }

        const number = Number(value);

        if (!Number.isFinite(number)) return '-';

        const cls = number > 0
            ? 'positive'
            : number < 0
                ? 'negative'
                : '';

        return `<span class="${cls}">${number.toFixed(2)}%</span>`;
    }

    function addCell(row, content, className = '') {

        const td = document.createElement('td');

        td.className = className;
        td.innerHTML = content;

        row.appendChild(td);
    }

    // ==========================================
    // PINTAR TABLA
    // ==========================================

    function renderFund(fund) {

        const isin = (fund.Isin || '').toUpperCase();

        const isDefault = defaultFunds.includes(isin);

        const row = document.createElement('tr');

        if (isDefault) {
            row.classList.add('default-fund');
        }

        // Nombre
        const nameCell = document.createElement('td');

        nameCell.className = 'fund-name';

        const link = document.createElement('a');

        link.href =
            'https://www.morningstar.es/es/funds/snapshot/snapshot.aspx?id=' +
            encodeURIComponent(fund.SecId || '');

        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'text-decoration-none fw-bold text-dark';

        link.textContent = fund.LegalName || fund.Name || 'N/D';

        nameCell.appendChild(link);
        row.appendChild(nameCell);

        // ISIN
        addCell(row, `<code>${isin || 'N/D'}</code>`);

        // Categoría
        addCell(
            row,
            `<span class="badge bg-secondary">${fund.CategoryName || 'N/D'}</span>`
        );

        // Precio
        addCell(
            row,
            fund.ClosePrice !== undefined && fund.ClosePrice !== null
                ? `${fund.ClosePrice} ${fund.PriceCurrency || ''}`
                : 'N/D',
            'text-end fw-bold'
        );

        // Fecha
        addCell(
            row,
            fund.ClosePriceDate
                ? fund.ClosePriceDate.substring(0, 10)
                : 'N/D',
            'text-center text-muted small'
        );

        // Rentabilidades
        addCell(row, formatPercent(fund.GBRReturnD1), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnW1), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnM3), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnM6), 'text-end');
        addCell(row, formatPercent(fund.GBRReturnM12), 'text-end');

        tbody.appendChild(row);
    }

    // ==========================================
    // EJECUCIÓN
    // ==========================================

    try {

        // Cada ISIN se consulta individualmente.
        // Promise.all conserva el orden original.
        const results = await Promise.all(
            fundsList.map(isin => fetchFund(isin))
        );

        const validFunds = results.filter(Boolean);

        loadingEl.style.display = 'none';

        if (validFunds.length === 0) {

            errorEl.innerHTML = `
                <div class="alert alert-danger shadow-sm">
                    No se ha podido recuperar ningún fondo de Morningstar.
                    Comprueba la conexión y el servicio.
                </div>
            `;

            return;
        }

        // Mostrar fondos encontrados
        validFunds.forEach(renderFund);

        document.getElementById('fund-count').textContent =
            `${validFunds.length} de ${fundsList.length} fondos encontrados`;

        tableCard.style.display = 'block';

        // Mostrar los ISIN que no se han encontrado
        const foundIsins = new Set(
            validFunds.map(f => f.Isin.toUpperCase())
        );

        const missing = fundsList.filter(
            isin => !foundIsins.has(isin)
        );

        if (missing.length > 0) {

            const warning = document.createElement('div');

            warning.className = 'alert alert-warning mt-3';

            warning.textContent =
                'No se han encontrado estos ISIN: ' +
                missing.join(', ');

            errorEl.appendChild(warning);
        }

    } catch (error) {

        loadingEl.style.display = 'none';

        errorEl.innerHTML = `
            <div class="alert alert-danger shadow-sm">
                <strong>Error al cargar los fondos</strong>
                <p class="mb-0 mt-2">${error.message}</p>
            </div>
        `;

        console.error('Fundstation:', error);
    }

});
</script>

</body>
</html>
